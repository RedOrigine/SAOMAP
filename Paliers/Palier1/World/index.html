<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="/SAOMAP/image/logoguildetransparent.png">

    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div class="parent">
      <div class="div1">
          <!-- <img src="/SAOMAP/image/logoguildepetit.png" #style="width:100%; height:auto;"> 
          <a href="https://discord.gg/vtsze9Regu " target="_blank"><img src="/SAOMAP/image/logodiscord.png" #style="width:100%; height:auto;"></a>
          <img src="/SAOMAP/image/logoguildepetit.png" #style="width:100%; height:auto;">  -->
      </div>
      <div class="div2">
        <div id="categorie" class="rectgris">
            <button type="button" id="ResetView" class="buttonReset"> Repositioner la carte 🔄</button>
            <h1>Catégorie :</h1>
            <div id="categorie_toggle">
                <div id='ForgeronMenu' class="menu">
                <button id="Forgeron" onclick="toggleLayerMarker(this)" class="btn-categorie">Forgeron</button>
                <ul id="Forgeron-Ul" class="submenu">

                </ul>
                </div>
                <button id="Alchimiste" onclick="toggleLayerMarker(this)" class="btn-categorie">Alchimiste</button>
                <button id="Quete" onclick="toggleLayerMarker(this)" class="btn-categorie">Quete</button>
                <button id="Secret" onclick="toggleLayerMarker(this)" class="btn-categorie">Secret</button>
                <button id="Mob" onclick="toggleLayerMarker(this)" class="btn-categorie">Mob</button>
                <button id="Lieu" onclick="toggleLayerMarker(this)" class="btn-categorie">Lieu</button>
                <button id="Marchand" onclick="toggleLayerMarker(this)" class="btn-categorie">Marchand</button>
                <button id="Donjon" onclick="toggleLayerMarker(this)" class="btn-categorie">Donjon</button>
                <button id="Boss" onclick="toggleLayerMarker(this)" class="btn-categorie">Boss</button>
                <button id="Ressources" onclick="toggleLayerMarker(this)" class="btn-categorie">Ressources</button>
            </div>
        </div>
      </div>
      <div class="div3">
        <div id="info" class="rectgris"></div>
      </div>
      <div class="div4">
          <div id="carte"></div>
      </div>
  </div>
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script type="module" src="script.js"></script>
  <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
    import { firebaseConfig } from '/firebase-config.js';

    const app = initializeApp(firebaseConfig);
    const auth = getAuth();

    // Vérifier si l'utilisateur est connecté
    onAuthStateChanged(auth, (user) => {
      if (!user) {
        window.location.href = "/login.html";
      }
    });
  </script>
</body>
</html>
